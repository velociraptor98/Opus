<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Opus">
  <!-- The mark is the pipeline: five bars, three filled, the live one coral.
       The wordmark is dropped at icon sizes — it would need an embedded font
       to render reliably at 16px, and the bars alone carry the identity.
       Square, because nothing in this system has a corner radius. -->
  <rect width="64" height="64" fill="#201e1d"/>

  <rect x="10" y="26" width="44" height="4" fill="#f3f2f2"/>
  <rect x="10" y="34" width="44" height="4" fill="#f3f2f2"/>
  <rect x="10" y="42" width="44" height="4" fill="#ec3013"/>
</svg>
