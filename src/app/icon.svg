<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Opus">
  <defs>
    <linearGradient id="opusTile" x1="6" y1="3" x2="58" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="0.5" stop-color="#000000"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="opusSheen" x1="0" y1="2" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="opusBorder" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="opusRingGlass" x1="32" y1="14" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="opusRingGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <!-- frosted black glass tile -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#opusTile)"/>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#opusSheen)"/>
  <rect x="1.6" y="1.6" width="60.8" height="60.8" rx="15.2" fill="none" stroke="url(#opusBorder)" stroke-width="1.2"/>
  <!-- soft depth shadow under the ring -->
  <path d="M 39.18 16.59 A 17 17 0 1 1 24.82 16.59" stroke="#000000" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" transform="translate(0,1.3)"/>
  <!-- soft bloom behind the ring -->
  <path d="M 39.18 16.59 A 17 17 0 1 1 24.82 16.59" stroke="#ffffff" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round" filter="url(#opusRingGlow)"/>
  <!-- open ring: glass body with vertical translucency -->
  <path d="M 39.18 16.59 A 17 17 0 1 1 24.82 16.59" stroke="url(#opusRingGlass)" stroke-width="6" stroke-linecap="round"/>
  <!-- inner refraction line -->
  <path d="M 39.18 16.59 A 17 17 0 1 1 24.82 16.59" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" transform="translate(0,-0.9)"/>
  <!-- specular glint along the top edge -->
  <path d="M 40.5 17.28 A 17 17 0 0 0 23.5 17.28" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
